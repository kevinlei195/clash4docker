# clash4docker-smart 示例配置文件
# 内核: Smart (vernesong/mihomo fork)
# 在 MetaCubeX/mihomo 基础上增加 Smart 策略组 + LightGBM + 严格路由 (strict-route)
#
# 配套 UI: metacubexd (Smart 推荐)
# Smart 内核文档: https://github.com/vernesong/mihomo
# Mihomo 配置文档: https://wiki.metacubex.one/
#
# 使用说明:
#   1. 二选一提供代理来源:
#      A. 订阅模式: 取消下面 proxy-providers.all.url 前的占位,填入订阅 URL,删除 proxies 段
#      B. 内联节点: 保留下面 proxies 示例,删除 proxy-providers 块
#   2. 把 secret 替换为强密码
#   3. 启用 TUN 时取消文件末尾的注释,并在 docker-compose.yml 同步打开 cap_add 与 devices

# ==================== Smart 独有全局字段 ====================
# geosite 匹配模式
#   fast        - 快速模式(默认),使用预编译路径索引
#   legacy      - 兼容旧版,逐条遍历
#   mapped      - 映射模式,支持别名展开
geosite-mode: fast

# geoip 匹配模式
#   fast        - 快速模式,使用 mmdb 优化(默认)
#   performance - 性能优先,与 fast 类似但更激进缓存
geoip-mode: fast

# GeoIP/GeoSite 数据文件格式
#   auto - 自动检测(默认)
#   mmdb - MaxMind GeoLite2 格式
#   dat  - Clash 传统 .dat 格式
geodat-format: auto

# LightGBM 模型(可选,需把 Model.bin 放入配置目录)
lgbm-auto-update: false            # 是否自动下载更新 LightGBM 模型
lgbm-update-interval: 72           # 自动更新间隔(小时)
lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin"

# 数据收集文件大小上限(MB),触发后自动停止采集
smart-collector-size: 100

# ==================== 基础配置 ====================
# HTTP 代理端口
# 订阅模式下可通过 HTTP_PORT 环境变量固定此值。
port: 7890
# SOCKS5 代理端口
# 订阅模式下可通过 SOCKS_PORT 环境变量固定此值。
socks-port: 7891
# 混合代理端口 (HTTP + SOCKS5)
# 订阅模式下可通过 MIXED_PORT 环境变量固定此值。
mixed-port: 7892
# 允许局域网连接
allow-lan: true
# 绑定地址
bind-address: '*'
# 运行模式: rule / global / direct
mode: rule
# 日志级别: silent / error / warning / info / debug
log-level: info
# IPv6 支持
ipv6: false

# ==================== API 控制器 ====================
# 外部控制器 (Dashboard 需要此配置)
external-controller: 0.0.0.0:9090
# API 密钥 (建议设置;在 dashboard 登录和 Controller API 中都要使用)
secret: 'your-secret-here'
# 外部 UI 目录 (Docker 中已内置,无需配置)
# external-ui: /app/ui

# ==================== DNS 配置 ====================
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - localhost.ptlogin2.qq.com
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  # Smart 推荐: 国内域名走国内 DNS,缩短解析时延与规避污染
  nameserver-policy:
    geosite:cn:
      - https://1.12.12.12/dns-query
      - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://1.12.12.12/dns-query
    - https://223.5.5.5/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# ==================== 代理来源(订阅模式 · 选 A) ====================
# 把 url 改成你的订阅地址;同时删除下面的 proxies 示例段
proxy-providers:
  all:
    type: http
    url: "https://your-subscription-url"
    interval: 3600
    path: ./proxies.yaml
    # 过滤机场常见的提示性节点(套餐/流量/到期等)
    exclude-filter: "(?=.*(流量|到期|网址|提示|剩余|套餐)).*$"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

# ==================== 代理节点(内联模式 · 选 B) ====================
# 与 proxy-providers 二选一。下方为最小可用的演示节点,请按需替换。
proxies:
  - name: '示例节点-VMess'
    type: vmess
    server: example.com
    port: 443
    uuid: your-uuid-here
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /path
      headers:
        Host: example.com

  - name: '示例节点-SS'
    type: ss
    server: example.com
    port: 8388
    cipher: aes-256-gcm
    password: your-password-here

  - name: '示例节点-Trojan'
    type: trojan
    server: example.com
    port: 443
    password: your-password-here
    sni: example.com
    skip-cert-verify: false

# ==================== 代理组 ====================
proxy-groups:
  # ---------- 区域分组 (url-test + filter) ----------
  # 与下方规则集配合,实现"哪个区域流量用哪个区域节点"的最优策略。
  # name 字段同时充当 rules 中可被引用的目标组。
  - name: 🇭🇰 HK
    type: url-test
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 7200
    include-all: true
    filter: "(?=.*(🇭🇰|香港|HK|Hongkong|Hong kong)).*$"
  - name: 🇹🇼 TW
    type: url-test
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 7200
    include-all: true
    filter: "(?=.*(🇹🇼|台湾|TW|Taiwan)).*$"
  - name: 🇸🇬 SG
    type: url-test
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 7200
    include-all: true
    filter: "(?=.*(🇸🇬|新加坡|SG|Singapore)).*$"
  - name: 🇯🇵 JP
    type: url-test
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 7200
    include-all: true
    filter: "(?=.*(🇯🇵|日本|JP|Japan)).*$"
  - name: 🇰🇷 KR
    type: url-test
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 7200
    include-all: true
    filter: "(?=.*(🇰🇷|韩国|KR|Korea)).*$"
  - name: 🇺🇸 US
    type: url-test
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 7200
    include-all: true
    filter: "(?=.*(🇺🇸|美国|US|America)).*$"

  # ---------- 自动测速 (普通 url-test) ----------
  - name: ♻️ AUTO
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 7200
    include-all: true

  # ---------- 🚀 Smart 主出口 (Smart 内核专属) ----------
  # 关键参数:
  #   policy-priority   节点名 pattern:权重,支持 regex
  #   strategy          sticky-sessions(粘性)/round-robin(轮询)
  #   health-check      Smart 组专属健康检查块(不接受外层 tolerance/interval)
  #   include-all       涵盖所有订阅节点
  #   uselightgbm       启用 LightGBM 预测权重(需 Model.bin)
  #   collectdata       采集训练数据到 smart_weight_data.csv
  - name: 🚀 Smart
    type: smart
    include-all: true
    policy-priority: "Premium:1.5;HK:1.2;SG:1.1;JP:1.0;US:0.9"
    strategy: sticky-sessions
    uselightgbm: false
    collectdata: false
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 60
      timeout: 5
      lazy: true

  # ---------- 兜底与直连 ----------
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 Smart

  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 Smart
      - ♻️ AUTO
      - 🇭🇰 HK
      - 🇸🇬 SG
      - 🇯🇵 JP

# ==================== 规则集 (Loyalsoldier/clash-rules) ====================
# 与你 docker-compose.yml 内的 volume 路径配套;
# 容器内 ./ruleset/ 即为 /root/.config/mihomo/ruleset/
rule-providers:
  reject:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/reject.yaml
    interval: 86400
  icloud:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt
    path: ./ruleset/icloud.yaml
    interval: 86400
  apple:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt
    path: ./ruleset/apple.yaml
    interval: 86400
  google:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt
    path: ./ruleset/google.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
    path: ./ruleset/proxy.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    path: ./ruleset/direct.yaml
    interval: 86400
  private:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
    path: ./ruleset/private.yaml
    interval: 86400
  gfw:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
    path: ./ruleset/gfw.yaml
    interval: 86400
  tld-not-cn:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt
    path: ./ruleset/tld-not-cn.yaml
    interval: 86400
  telegramcidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt
    path: ./ruleset/telegramcidr.yaml
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
    path: ./ruleset/cncidr.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./ruleset/lancidr.yaml
    interval: 86400
  applications:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt
    path: ./ruleset/applications.yaml
    interval: 86400

# ==================== 分流规则(白名单模式) ====================
# 白名单 = 大部分流量代理,国内明确直连;改 MATCH 后目标即可切换为黑名单(MATCH → DIRECT)
rules:
  # 必要的解析连通性兜底
  - IP-CIDR,1.1.1.1/32,🚀 Smart,no-resolve
  - IP-CIDR,8.8.8.8/32,🚀 Smart,no-resolve

  # 直连路径
  - RULE-SET,applications,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,cncidr,DIRECT

  # 代理路径(交给 Smart 自动选最佳节点)
  - RULE-SET,tld-not-cn,🚀 Smart
  - RULE-SET,gfw,🚀 Smart
  - RULE-SET,telegramcidr,🚀 Smart

  # GeoIP 兜底
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT

  # 兜底(白名单模式: 全走代理)
  - MATCH,🚀 Smart

# ==================== TUN 模式(可选) ====================
# 启用时:
#   1. 取消下方注释;
#   2. docker-compose.yml 取消 cap_add (NET_ADMIN) 和 devices (/dev/net/tun) 注释;
#   3. 容器会接管自身网络命名空间,需要本机侧设置 NAT/路由才能对外提供网关能力。
#
# Smart 推荐:
#   - stack: system       相比 mixed 更高效
#   - strict-route: true  Smart 特有,严格路由避免流量泄漏到直连网卡
#
#tun:
#  enable: true
#  stack: system
#  auto-route: true
#  auto-redirect: true
#  auto-detect-interface: true
#  strict-route: true
